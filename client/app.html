<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Car Portal - App</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <input id="searchInput" placeholder="Search (e.g., Ford Mustang)" />
    <button id="searchBtn">Search</button>
    <button id="logoutBtn">Logout</button>
  </header>

  <main>
  <section>
    <h2>Recommended cars</h2>
    <div id="recommended" class="grid"></div>
  </section>

  <section>
    <h2>Search results</h2>
    <div id="cards" class="grid"></div>
  </section>

  <section>
    <h2>Car details</h2>
    <pre id="details"></pre>
  </section>
</main>


  <script src="js/app.js"></script>
</body>
</html>
